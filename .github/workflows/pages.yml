name: Pruebas y publicación
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Cálculos y navegador
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar JavaScript y cálculos
        run: |
          node --check dist/app.js
          node --check dist/engine.js
          node --check dist/presentation.js
          node --check dist/report-image.js
          node --check dist/mobile-report.js
          node --check dist/formations.js
          node --check dist/event-report.js
          node --check dist/time-input.js
          node --check dist/sw.js
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Instalar navegador de prueba
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Probar la aplicación en el navegador
        run: |
          python -m http.server 4173 --directory dist > /tmp/controlmin-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4173',timeout=2)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('No se pudo iniciar el servidor de prueba')
          PY
          python tests/browser_smoke.py
          python tests/browser_tactics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e-informe-de-prueba
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
